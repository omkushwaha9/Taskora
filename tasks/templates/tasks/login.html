<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Taskora</title>
</head>
<body>
    <h1>Log in to Taskora</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>

    <p>New to Taskora?
        <a href="{% url 'register' %}">Create an account</a>
    </p>
</body>
</html>
